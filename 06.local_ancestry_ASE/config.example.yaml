window: example
posterior_threshold: 0.80
minimum_markers: 30
minimum_total_count: 10
site_fdr_threshold: 0.05
donor_ancestries:
  - Yak
  - Gayal
background_ancestries:
  - SAI
  - Taurine
rfmix:
  reference_bcf: data/rfmix_inputs/chr1.reference.clean.bcf
  query_bcf: data/rfmix_inputs/chr1.query.clean.bcf
  sample_map: data/rfmix_inputs/reference_sample_map.tsv
  genetic_map: data/rfmix_inputs/chr1.uniform_fullchr_1Mb_1cM.map.tsv
  chromosome: 1
  output_prefix: results/example/rfmix/chr1.rfmix.fullchr
inputs:
  msp:
    - results/example/rfmix/chr1.rfmix.fullchr.msp.tsv
  fb:
    - results/example/rfmix/chr1.rfmix.fullchr.fb.tsv
  gtf: data/annotation.gtf
  phaser_blocks: data/phaser/sample.haplotypic_counts.tsv
  phased_genotypes: data/phased/sample.vcf.gz
  site_ase: data/site_ASE/significant.tsv
outputs:
  root: results/example
